<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shay's Travel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1d2e 0%, #252840 100%);
      border-bottom: 1px solid #2e3250;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c9ef0, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .header-left p {
      color: #8b93b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7c9ef0, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.72rem;
      color: #8b93b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    #map {
      width: 100%;
      height: 60vh;
      min-height: 400px;
      background: #0f1117;
    }

    .leaflet-tile-pane { filter: none; }

    .countries-section {
      padding: 32px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #c5cae9;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2e3250;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #2e3250;
      background: transparent;
      color: #8b93b8;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #7c9ef0;
      border-color: #7c9ef0;
      color: #fff;
    }

    .countries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .country-card {
      background: #1a1d2e;
      border: 1px solid #2e3250;
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .country-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7c9ef0, #a78bfa);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .country-card:hover, .country-card.highlighted {
      border-color: #7c9ef0;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 158, 240, 0.15);
    }

    .country-card:hover::before, .country-card.highlighted::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .country-flag {
      font-size: 2rem;
      line-height: 1;
    }

    .visit-count {
      background: rgba(124, 158, 240, 0.15);
      color: #7c9ef0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .country-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e8eaf0;
      margin-bottom: 2px;
    }

    .city-name {
      font-size: 0.82rem;
      color: #8b93b8;
      margin-bottom: 10px;
    }

    .city-name span {
      color: #7c9ef0;
    }

    .visits-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .visit-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.78rem;
      color: #6b7499;
    }

    .visit-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a78bfa;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .visit-date {
      color: #b9c0e6;
      font-weight: 500;
    }

    .visit-days {
      color: #4a5080;
      font-weight: 400;
      font-size: 0.72rem;
    }

    .visit-transport {
      color: #6b7499;
      font-size: 0.72rem;
      margin-top: 1px;
    }

    .card-section-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #4a5080;
      margin: 10px 0 4px;
    }

    .card-section-label:first-of-type {
      margin-top: 0;
    }

    /* Custom map marker */
    .custom-marker {
      background: linear-gradient(135deg, #7c9ef0, #a78bfa);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .custom-marker-inner {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      transform: rotate(45deg);
    }

    .leaflet-popup-content-wrapper {
      background: #1a1d2e;
      border: 1px solid #2e3250;
      border-radius: 10px;
      color: #e8eaf0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .leaflet-popup-tip {
      background: #1a1d2e;
    }

    .popup-content {
      min-width: 180px;
    }

    .popup-flag { font-size: 1.8rem; margin-bottom: 4px; }
    .popup-country { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
    .popup-city { color: #7c9ef0; font-size: 0.82rem; margin-bottom: 8px; }
    .popup-dates { font-size: 0.75rem; color: #8b93b8; }
    .popup-dates div { margin-bottom: 2px; padding-left: 10px; position: relative; }
    .popup-dates div::before { content: '→'; position: absolute; left: 0; color: #a78bfa; }

    .timeline-section {
      padding: 0 32px 32px;
    }

    .tl-log {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .tl-log::before {
      content: '';
      position: absolute;
      left: 112px;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, #7c9ef0, #a78bfa, #3d4166);
    }

    .tl-entry {
      display: grid;
      grid-template-columns: 110px 2px 1fr;
      gap: 0 16px;
      align-items: flex-start;
      min-height: 48px;
    }

    .tl-date-col {
      text-align: right;
      padding: 10px 0;
    }

    .tl-date-main {
      font-size: 0.78rem;
      font-weight: 700;
      color: #c5cae9;
      line-height: 1.2;
    }

    .tl-date-year {
      font-size: 0.68rem;
      color: #4a5080;
      margin-top: 2px;
    }

    .tl-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }

    .tl-node {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7c9ef0;
      border: 2px solid #0f1117;
      flex-shrink: 0;
      z-index: 1;
    }

    .tl-node.future {
      background: #3d4166;
      border-color: #4a5080;
    }

    .tl-body {
      padding: 8px 0 8px 0;
    }

    .tl-flag-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e8eaf0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tl-city {
      font-size: 0.76rem;
      color: #6b7499;
      margin-top: 2px;
    }

    .tl-year-divider {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #3d4166;
      text-transform: uppercase;
      padding: 16px 0 8px;
      position: relative;
    }

    .events-section {
      padding: 0 32px 32px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .event-card {
      background: #141620;
      border: 1px solid #2a2d45;
      border-left: 3px solid #f59e0b;
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .event-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.12);
    }

    .event-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #e8eaf0;
      margin-bottom: 3px;
    }

    .event-venue {
      font-size: 0.78rem;
      color: #f59e0b;
      margin-bottom: 6px;
    }

    .event-date {
      font-size: 0.75rem;
      color: #6b7499;
    }

    .event-marker {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 26px;
      height: 26px;
      border: 2px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    footer {
      text-align: center;
      padding: 20px 32px;
      color: #3d4166;
      font-size: 0.75rem;
      border-top: 1px solid #1a1d2e;
    }

    /* ── Calendar Section ── */
    .calendar-section { padding: 0 32px 32px; }

    .cal-wrapper {
      background: #1a1d2e;
      border: 1px solid #2e3250;
      border-radius: 16px;
      padding: 24px;
      max-width: 680px;
    }

    .cal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .cal-nav {
      background: transparent;
      border: 1px solid #2e3250;
      color: #8b93b8;
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      padding: 4px 14px 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .cal-nav:hover { background: #7c9ef0; border-color: #7c9ef0; color: #fff; }

    .cal-month-label {
      flex: 1;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      color: #c5cae9;
      min-width: 160px;
    }

    .cal-date-jump {
      background: #12152a;
      border: 1px solid #2e3250;
      color: #8b93b8;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .cal-date-jump::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

    .cal-day-names {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 5px;
    }
    .cal-day-names span {
      text-align: center;
      font-size: 0.65rem;
      color: #4a5080;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 0;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-cell {
      min-height: 38px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      user-select: none;
      position: relative;
    }
    .cal-cell:hover:not(.empty) { transform: scale(1.12); z-index: 1; }
    .cal-cell.empty { background: transparent !important; cursor: default; border: none; }
    .cal-cell.today { box-shadow: 0 0 0 2px #7c9ef0; }
    .cal-cell.selected { box-shadow: 0 0 0 2.5px #fff; transform: scale(1.12); z-index: 1; }

    .cal-result {
      margin-top: 18px;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: #12152a;
      border-radius: 10px;
      border: 1px solid #2e3250;
    }
    .cal-result-flag { font-size: 2.4rem; line-height: 1; }
    .cal-result-country { font-size: 1rem; font-weight: 700; }
    .cal-result-city { font-size: 0.8rem; color: #6b7499; margin-top: 3px; }
    .cal-result-date { font-size: 0.72rem; color: #4a5080; margin-top: 5px; }

    .cal-legend {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cal-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      padding: 3px 9px 3px 6px;
      border-radius: 20px;
      border: 1px solid transparent;
    }
  .country-card { cursor: default; }
  .card-header { display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0; }
  .card-header:hover .country-name { color:#7c9ef0; }
  .card-chevron { margin-left:auto;font-size:1.1rem;color:#4a5080;transition:transform .2s;flex-shrink:0; }
  .country-card.expanded .card-chevron { transform:rotate(90deg); }
  .card-body { display:none;margin-top:12px;padding-top:12px;border-top:1px solid #2e3250; }
  .country-card.expanded .card-body { display:block; }
  .flag-img { border-radius:2px;vertical-align:middle; }
  .fly-btn { margin-top:10px;background:rgba(124,158,240,.12);border:1px solid rgba(124,158,240,.25);color:#7c9ef0;padding:4px 12px;border-radius:8px;font-size:.76rem;cursor:pointer; }
  .fly-btn:hover { background:rgba(124,158,240,.28); }
  .now-in-banner { font-size:30px;color:#c5cae9;font-weight:600;text-align:center;width:100%;display:block;line-height:1.3;padding:16px 0 6px;background:#0d0f1e; }
  .now-in-banner strong { color:#7c9ef0; }
  .now-in-flag { display:block;font-size:32px;line-height:1.4;padding:2px 0;background:#0d0f1e; }
  .now-in-time { display:block;font-size:15px;font-weight:400;color:#8b93b8;letter-spacing:.5px;padding-bottom:14px;background:#0d0f1e; }
  .tl-month { font-size:.76rem;font-weight:700;color:#c5cae9; }
  .tl-home .tl-node { background:#4a5080; }
  .tl-home .tl-flag-name { color:#6b7499; }
  .tl-expected .tl-flag-name { opacity:.7; }
  .tl-node.expected { background:transparent;border-style:dashed;border-color:#6b7499; }
  .cal-cell.expected { border-style:dashed !important; opacity:.75; }
  .cal-legend-item.expected { border-style:dashed; opacity:.75; }

  /* ── Tabs ── */
  .tab-nav { display:flex; gap:0; background:#12152a; border-bottom:1px solid #2e3250; padding:0 24px; flex-wrap:wrap; }
  .tab-btn { background:transparent; border:none; border-bottom:3px solid transparent; color:#6b7499; padding:14px 20px; font-size:.9rem; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .tab-btn:hover { color:#c5cae9; }
  .tab-btn.active { color:#7c9ef0; border-bottom-color:#7c9ef0; }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; }

  /* ── Sort bar ── */
  .sort-bar { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .sort-label { font-size:.78rem; color:#6b7499; }
  .sort-btn { padding:5px 13px; border-radius:20px; border:1px solid #2e3250; background:transparent; color:#8b93b8; cursor:pointer; font-size:.8rem; transition:all .2s; }
  .sort-btn:hover, .sort-btn.active { background:#a78bfa; border-color:#a78bfa; color:#fff; }

  /* ── Years-back filter ── */
  .years-filter { display:flex; align-items:center; gap:8px; }
  .years-filter label { font-size:.78rem; color:#8b93b8; }
  .years-filter select {
    background:#12152a; border:1px solid #2e3250; color:#e8eaf0;
    padding:6px 10px; border-radius:8px; font-size:.82rem; cursor:pointer;
  }
  .years-filter select:focus { outline:none; border-color:#7c9ef0; }
  /* ── Timeline slider bar ── */
  #tl-bar {
    background: #0d0f1e;
    border-top: 1px solid #2e3250;
    padding: 10px 16px 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  #tl-play-btn {
    background: linear-gradient(135deg,#7c9ef0,#a78bfa);
    border: none; border-radius: 50%;
    width: 38px; height: 38px; font-size: 15px;
    cursor: pointer; color: #fff; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(124,158,240,0.4);
    transition: transform .15s;
  }
  #tl-play-btn:hover { transform: scale(1.1); }
  #tl-slider {
    flex: 1; min-width: 120px;
    accent-color: #7c9ef0;
    cursor: pointer; height: 5px;
  }
  #tl-info { text-align: right; min-width: 160px; }
  #tl-date { font-size: .95rem; color: #c5cae9; font-weight: 600; }
  #tl-loc  { font-size: .75rem; color: #6b7499; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  #tl-speed { background:#12152a; border:1px solid #2e3250; color:#8b93b8; border-radius:8px; padding:3px 8px; font-size:.75rem; cursor:pointer; }
  /* ── Timeline date overlay on map ── */
  #tab-map { position: relative; }
  #tl-date-overlay {
    display: none;
    position: absolute;
    top: 58px; left: 50%; transform: translateX(-50%);
    background: rgba(10,12,28,0.82);
    backdrop-filter: blur(6px);
    color: #e8eaf0;
    padding: 10px 28px;
    border-radius: 30px;
    font-size: 1.5rem; font-weight: 700; letter-spacing: 3px;
    z-index: 1000; pointer-events: none;
    border: 1px solid rgba(124,158,240,0.35);
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    white-space: nowrap;
  }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>✈️ Shay's Travel Map</h1>
  </div>
  <div class="years-filter">
    <label for="years-back-select">Show last</label>
    <select id="years-back-select">
      <option value="0">All time</option>
      <option value="1">1 year</option>
      <option value="2">2 years</option>
      <option value="3">3 years</option>
      <option value="5">5 years</option>
      <option value="10">10 years</option>
    </select>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-number" id="stat-countries">—</div><div class="stat-label">Countries</div></div>
    <div class="stat"><div class="stat-number" id="stat-years">—</div><div class="stat-label">Years</div></div>
    <div class="stat"><div class="stat-number" id="stat-continents">—</div><div class="stat-label">Continents</div></div>
  </div>
</header>
<p class="now-in-banner" id="now-in"></p>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('map',this)">🗺 Map</button>
  <button class="tab-btn" onclick="showTab('countries',this)">🌍 Countries</button>
  <button class="tab-btn" onclick="showTab('timeline',this)">📅 Timeline</button>
  <button class="tab-btn" onclick="showTab('events',this)">🎪 Events</button>
</nav>

<div class="tab-pane active" id="tab-map">
  <div id="tl-date-overlay"></div>
  <div class="filter-bar" id="map-filter-bar" style="padding:16px 16px 0">
    <button class="filter-btn active" onclick="filterMapLayers('all', this)">All</button>
    <button class="filter-btn" onclick="filterMapLayers('countries', this)">Countries</button>
    <button class="filter-btn" onclick="filterMapLayers('events', this)">Events</button>
  </div>
  <div id="map"></div>
  <div id="tl-bar">
    <button id="tl-play-btn" onclick="tlTogglePlay()" title="Play / Pause">▶</button>
    <input type="range" id="tl-slider" min="0" max="10000" step="1" value="10000" oninput="tlSeek(this.value)">
    <select id="tl-speed" onchange="tlSetSpeed(this.value)" title="Playback speed">
      <option value="30">Extra slow</option>
      <option value="100">Slow</option>
      <option value="300" selected>Normal</option>
      <option value="600">Fast</option>
      <option value="1200">Very fast</option>
    </select>
    <div id="tl-info"><div id="tl-date">—</div><div id="tl-loc">—</div></div>
  </div>
</div>

<div class="tab-pane" id="tab-countries">
  <div class="countries-section">
    <div class="section-title">All Countries Visited</div>
    <div class="sort-bar">
      <span class="sort-label">Sort:</span>

<footer>
  Data sourced from flight confirmations, train bookings &amp; accommodation emails in shay.erov@gmail.com
</footer>

<script src="shay-travel-data.js"></script>
<script>

// Initialize map
const map = L.map('map', {
  center: [30, 20],
  zoom: 2.3,
  minZoom: 2,
  zoomControl: true,
  scrollWheelZoom: true,
  worldCopyJump: false,
  maxBoundsViscosity: 1.0
});
map.setMaxBounds(L.latLngBounds(L.latLng(-85.06,-180), L.latLng(85.06,180)));

// Allow zooming out a bit further than "world fills container width"
function fitMapZoom() {
  var w = document.getElementById('map').clientWidth || window.innerWidth;
  var minZ = Math.ceil(Math.log2(w / 256));
  map.setMinZoom(Math.max(1, minZ - 2));
  if (map.getZoom() < map.getMinZoom()) map.setZoom(map.getMinZoom());
}
window.addEventListener('resize', fitMapZoom);
fitMapZoom();

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
  noWrap: true
}).addTo(map);

// Flag image helpers
function flagIso(e){return[...e].map(c=>String.fromCharCode(c.codePointAt(0)-0x1F1E6+65)).join('').toLowerCase();}
function flagSrc(e){return'https://flagcdn.com/w40/'+flagIso(e)+'.png';}
function flagImg(e,s){s=s||20;return'<img src="'+flagSrc(e)+'" width="'+s+'" height="'+Math.round(s*.67)+'" style="border-radius:2px;display:inline-block;vertical-align:middle;" onerror="this.style.display=\'none\'">';}

// Strip booking refs / confirmation numbers / PNRs / e-ticket numbers from
// any text before it's rendered. The data file may retain these for Shay's
// own records, but they must never be shown on the site.
function stripBookingCodes(text) {
  if (!text) return text;
  var out = String(text)
    // "PNR: ABC123", "(Booking ref XYZ789)", "Confirmation #123456",
    // "Record locator: ABC123", "E-ticket 1234567890"
    .replace(/\(?\s*(?:PNR|Booking\s*ref(?:erence)?|Confirmation(?:\s*(?:number|code|no\.?|#))?|Conf(?:irmation)?\.?\s*#?|Record\s*locator|Locator|E-?ticket(?:\s*(?:number|no\.?))?)\s*:?\s*#?\s*[A-Z0-9-]{4,}\)?/gi, '')
    // standalone "#123456" style order/booking numbers
    .replace(/#\d{4,}/g, '');
  // tidy up artifacts left behind (empty parens, dangling separators, double spaces)
  out = out
    .replace(/\(\s*\)/g, '')
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([;,)])/g, '$1')
    .replace(/([(;,])\s*([;,)])/g, '$1$2')
    .replace(/[;,]\s*$/, '')
    .trim();
  return out;
}

// ── Years-back filter ──
var yearsBack = 0;       // 0 = all time
var mapTypeFilter = 'all';
var regionFilter = 'all';

function getYearsCutoff() {
  if (!yearsBack) return null;
  var d = new Date();
  d.setFullYear(d.getFullYear() - yearsBack);
  return d;
}

// True if dateStr (ISO "YYYY-MM-DD") is within the cutoff window (or no cutoff).
function isRecentEnough(dateStr, cutoff) {
  if (!cutoff || !dateStr) return true;
  return new Date(dateStr) >= cutoff;
}

// For free-text dates like "Aug 24–Sep 1, 2025" or "Jan 2026": find the
// latest year mentioned. Future years always pass (upcoming plans aren't
// affected by a "how far back" filter).
function eventPassesYearsFilter(dateStr, cutoff) {
  if (!cutoff) return true;
  var years = (dateStr.match(/\d{4}/g) || []).map(Number);
  if (!years.length) return true;
  var maxYear = Math.max.apply(null, years);
  var thisYear = new Date().getFullYear();
  if (maxYear > thisYear) return true;
  return maxYear >= cutoff.getFullYear();
}

// Custom icon factory
function createIcon(flag) {
  return L.divIcon({
    className: '',
    html: '<div style="background:linear-gradient(135deg,#7c9ef0,#a78bfa);border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:36px;height:36px;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);display:flex;">'+flagImg(flag,22)+'</span></div>',
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38]
  });
}

// Layer groups for map filter (All / Countries / Events)
var countryLayer = L.layerGroup().addTo(map);
var eventLayer = L.layerGroup().addTo(map);

function filterMapLayers(type, btn) {
  document.querySelectorAll('#map-filter-bar .filter-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  mapTypeFilter = type;
  applyMapFilters();
}

// Re-applies both the map-type filter (All/Countries/Events) and the
// years-back filter to the individual markers in each layer group.
function applyMapFilters() {
  var cutoff = getYearsCutoff();
  var showCountries = (mapTypeFilter === 'all' || mapTypeFilter === 'countries');
  var showEvents = (mapTypeFilter === 'all' || mapTypeFilter === 'events');

  countryMarkers.forEach(function(item) {
    var shouldShow = showCountries && isRecentEnough(countryLastStay[item.name], cutoff);
    if (shouldShow) { if (!countryLayer.hasLayer(item.marker)) countryLayer.addLayer(item.marker); }
    else { if (countryLayer.hasLayer(item.marker)) countryLayer.removeLayer(item.marker); }
  });

  eventMarkers.forEach(function(item) {
    var shouldShow = showEvents && eventPassesYearsFilter(item.date, cutoff);
    if (shouldShow) { if (!eventLayer.hasLayer(item.marker)) eventLayer.addLayer(item.marker); }
    else { if (eventLayer.hasLayer(item.marker)) eventLayer.removeLayer(item.marker); }
  });

  if (!map.hasLayer(countryLayer)) map.addLayer(countryLayer);
  if (!map.hasLayer(eventLayer)) map.addLayer(eventLayer);
}

// Approximate geographic centroid for each visited country, used to place
// the flag pin in the middle of the country rather than at the specific
// city/region visited (c.lat/c.lng, still used for "Show on map" flyTo).
// Antarctica is intentionally omitted - its true centroid sits at the pole
// and would render off the edge of the map, so it keeps its peninsula coords.
const COUNTRY_CENTROID = {
  "Israel": [31.4, 35.0],
  "New Zealand": [-41.5, 172.8],
  "Austria": [47.6, 14.1],
  "France": [46.6, 2.6],
  "Greece": [39.1, 22.9],
  "Malta": [35.9, 14.4],
  "China": [35.0, 103.8],
  "Germany": [51.2, 10.4],
  "Switzerland": [46.8, 8.2],
  "Denmark": [56.0, 9.5],
  "United Kingdom": [54.0, -2.9],
  "Belgium": [50.6, 4.6],
  "Spain": [40.2, -3.7],
  "Hungary": [47.2, 19.4],
  "Slovakia": [48.7, 19.5],
  "Ireland": [53.4, -8.2],
  "Netherlands": [52.3, 5.8],
  "Sweden": [62.2, 15.6],
  "Bulgaria": [42.7, 25.3],
  "Montenegro": [42.7, 19.3],
  "Cyprus": [35.1, 33.3],
  "Japan": [36.5, 138.0],
  "Seychelles": [-4.7, 55.5],
  "South Africa": [-29.0, 24.0],
  "Egypt": [26.8, 30.8],
  "Costa Rica": [9.9, -84.0],
  "Italy": [42.8, 12.6],
  "Argentina": [-35.4, -65.0],
  "Bolivia": [-16.7, -64.7],
  "Chile": [-35.6, -71.6],
  "Peru": [-9.2, -75.0],
  "Brazil": [-10.3, -53.2],
  "India": [22.4, 78.7],
  "Portugal": [39.6, -8.2],
  "Ecuador": [-1.5, -78.4],
  "Canada": [61.0, -98.0],
  "Mexico": [23.6, -102.5],
  "United States": [39.8, -98.6]
};

// Add markers
var countryMarkers = [];
var eventMarkers = [];
countries.forEach((c, i) => {
  const pin = COUNTRY_CENTROID[c.name] || [c.lat, c.lng];
  const marker = L.marker(pin, { icon: createIcon(c.flag) });

  const datesHtml = c.visits.map(v => `<div>${stripBookingCodes(v)}</div>`).join('');

  marker.bindPopup(`
    <div class="popup-content">
      <div class="popup-flag">${c.flag}</div>
      <div class="popup-country">${c.name}</div>
      <div class="popup-city">📍 ${stripBookingCodes(c.city)}</div>
      <div class="popup-dates">${datesHtml}</div>
    </div>
  `, { maxWidth: 260 });

  marker.on('click', () => {
    const card = document.getElementById(`card-${i}`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('highlighted');
      setTimeout(() => card.classList.remove('highlighted'), 2000);
    }
  });

  marker.addTo(countryLayer);
  countryMarkers.push({ marker: marker, name: c.name });
});

// Visit & day counts per country, derived from stays[] (the actual travel
// log) rather than the free-text `visits` notes, which can bundle several
// sub-events under one entry or split a single trip across several entries.
// Stays where from === to are same-day airport transits/layovers under 24h,
// so they don't count as a visit and don't add to the day total. Consecutive
// stays in the same country with no gap (multi-leg trips) are merged into a
// single visit.
const daysByCountry = {};
const visitsByCountry = {};
// Merged trips per country (consecutive same-country legs with no gap are one
// trip), used to render the per-country "Visits" list with date ranges.
const tripsByCountry = {};
{
  let prevCountry = null, prevTo = null, currentTrip = null;
  stays.filter(s => s.to !== s.from).forEach(s => {
    const days = Math.round((new Date(s.to) - new Date(s.from)) / 86400000) + 1;
    daysByCountry[s.country] = (daysByCountry[s.country] || 0) + days;
    const isContinuation = (s.country === prevCountry && s.from === prevTo);
    if (isContinuation && currentTrip) {
      currentTrip.to = s.to;
      currentTrip.legs.push(s);
    } else {
      visitsByCountry[s.country] = (visitsByCountry[s.country] || 0) + 1;
      currentTrip = { from: s.from, to: s.to, legs: [s] };
      (tripsByCountry[s.country] = tripsByCountry[s.country] || []).push(currentTrip);
    }
    prevCountry = s.country; prevTo = s.to;
  });
}

// Format a date range for display, e.g. "Jun 29 – Jul 4, 2020" or
// "Aug 25 – Sep 1, 2014" or "Dec 29, 2023 – May 6, 2024".
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return MONTH_NAMES[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear();
}
function fmtRange(from, to) {
  const f = new Date(from + 'T00:00:00'), t = new Date(to + 'T00:00:00');
  if (f.getFullYear() === t.getFullYear() && f.getMonth() === t.getMonth()) {
    return MONTH_NAMES[f.getMonth()] + ' ' + f.getDate() + '–' + t.getDate() + ', ' + f.getFullYear();
  }
  if (f.getFullYear() === t.getFullYear()) {
    return MONTH_NAMES[f.getMonth()] + ' ' + f.getDate() + ' – ' + MONTH_NAMES[t.getMonth()] + ' ' + t.getDate() + ', ' + f.getFullYear();
  }
  return fmtDate(from) + ' – ' + fmtDate(to);
}

// Pull out only the transport-related fragments (flight numbers/airlines,
// trains, buses, ferries, drives) from a stay's free-text description,
// dropping accommodation/reservation details (Airbnb, hostels, hotels) and
// event names - those are covered separately by the Events list.
const TRANSPORT_RE = /\b([A-Z]{1,3}\s?\d{2,4}|→|FlixBus|Ryanair|Wizz ?[Aa]ir|easyJet|Austrian|Aegean|Qatar|Etihad|Air ?NZ|Air New Zealand|SWISS|El ?Al|China Eastern|Qantas|Lufthansa|Air ?Malta|ÖBB|DB ?Bahn|DB train|Eurostar|Eurowings|Eurolines|Omio|Greyhound|Iberia|TACA|TAM|LAN|Avianca|AeroGal|Transavia|Brussels Airlines|Turkish Airlines|Israir|Pegasus|Air France|Air Canada|British Airways|West ?Jet|SAS|KLM|train|ferry|drove|flew|flight)\b/i;
function extractTransport(text) {
  if (!text) return '';
  const parts = text.split(/[–;]/).map(s => s.trim()).filter(Boolean);
  // Skip the first part (the place name) and keep only transport-looking segments.
  const segs = parts.filter((p, idx) => idx > 0 && TRANSPORT_RE.test(p));
  return stripBookingCodes(segs.join('; '));
}

// Transport in/out for a merged trip: from the first leg's description (covers
// arrival, and departure too if it's a single-leg trip) plus, for multi-leg
// trips, the last leg's description (covers the final departure).
function tripTransport(trip) {
  const segs = [];
  const first = extractTransport(trip.legs[0].city);
  if (first) segs.push(first);
  if (trip.legs.length > 1) {
    const last = extractTransport(trip.legs[trip.legs.length - 1].city);
    if (last && last !== first) segs.push(last);
  }
  return segs.join('; ');
}

// Match an event's free-text address to a country name, accounting for the
// common abbreviations/aliases used in addresses.
const COUNTRY_ALIASES = {
  "United States": ["United States", "USA"],
  "United Kingdom": ["United Kingdom", "UK", "England", "Scotland", "Wales"],
  "New Zealand": ["New Zealand", "NZ"]
};
function eventInCountry(ev, countryName) {
  const aliases = COUNTRY_ALIASES[countryName] || [countryName];
  return aliases.some(a => new RegExp('\\b' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(ev.address));
}

// Most recent stay (by 'to' date) per country - used by the years-back filter
const countryLastStay = {};
stays.forEach(function(s){ if(!countryLastStay[s.country]||s.to>countryLastStay[s.country]) countryLastStay[s.country]=s.to; });

// Faded markers for upcoming/booked-but-not-yet-visited countries, derived
// from expectedStays. Shown with reduced opacity + a dashed flag pin so it's
// obvious these are estimates from flight bookings, not confirmed visits.
const FUTURE_COUNTRY_CENTROID = {
  "Lithuania": [55.3, 23.9],
  "Poland": [52.1, 19.4]
};

function createFutureIcon(flag) {
  return L.divIcon({
    className: '',
    html: '<div style="opacity:.55;background:transparent;border:2.5px dashed #a0a6cc;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);"><span style="transform:rotate(45deg);display:flex;">'+flagImg(flag,22)+'</span></div>',
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38]
  });
}

const futureCountries = {};
expectedStays.forEach(s => {
  if (countryLastStay[s.country]) return; // already visited - not a new "future" country
  if (!futureCountries[s.country]) futureCountries[s.country] = { flag: s.flag, country: s.country, ranges: [] };
  futureCountries[s.country].ranges.push(s.from + ' – ' + s.to);
});
Object.values(futureCountries).forEach(fc => {
  const pin = FUTURE_COUNTRY_CENTROID[fc.country];
  if (!pin) return;
  const marker = L.marker(pin, { icon: createFutureIcon(fc.flag), opacity: 0.6 });
  marker.bindPopup(`
    <div class="popup-content">
      <div class="popup-flag">${fc.flag}</div>
      <div class="popup-country">${fc.country}</div>
      <div class="popup-city">🔮 Upcoming (estimated)</div>
      <div class="popup-dates">${fc.ranges.map(r => `<div>${r}</div>`).join('')}</div>
    </div>
  `, { maxWidth: 260 });
  marker.addTo(countryLayer);
  countryMarkers.push({ marker: marker, name: fc.country });
});

// Build country cards
const grid = document.getElementById('countries-grid');

countries.forEach((c, i) => {
  const card = document.createElement('div');
  card.className = 'country-card';
  card.id = `card-${i}`;
  card.dataset.region = c.region;
  card.dataset.name = c.name;
  const visitCount = visitsByCountry[c.name] || 0;
  const dayCount = daysByCountry[c.name] || 0;
  card.dataset.visits = visitCount;
  card.dataset.days = dayCount;
  card.dataset.lastvisit = countryLastStay[c.name] || '';

  // Visits: one entry per merged trip, showing just the date range plus
  // transport in/out (no accommodation/reservation details).
  const trips = tripsByCountry[c.name] || [];
  const visitsHtml = trips.map(trip => {
    const transport = tripTransport(trip);
    const tripDays = Math.round((new Date(trip.to) - new Date(trip.from)) / 86400000) + 1;
    const daysLabel = tripDays + ' day' + (tripDays === 1 ? '' : 's');
    return '<div class="visit-item"><div class="visit-dot"></div><div>'+
      '<div class="visit-date">'+fmtRange(trip.from, trip.to)+' <span class="visit-days">'+daysLabel+'</span></div>'+
      (transport ? '<div class="visit-transport">'+transport+'</div>' : '')+
      '</div></div>';
  }).join('');

  // Events: all burns/concerts/etc. that took place in this country, dates only.
  const countryEvents = events.filter(ev => eventInCountry(ev, c.name));
  const eventsHtml = countryEvents.map(ev =>
    `<div class="visit-item"><div class="visit-dot"></div><span>${ev.emoji} ${stripBookingCodes(ev.name)} — ${ev.date}</span></div>`
  ).join('');

  const noteHtml = c.note ? '<div style="margin-top:8px;font-size:.74rem;color:#4a5080;font-style:italic">'+stripBookingCodes(c.note)+'</div>' : '';
  // Israel is home base - "visits/days away" doesn't apply the same way.
  const visitCountLabel = (c.name === HOME.country)
    ? 'Home base'
    : (visitCount+' visit'+(visitCount===1?'':'s')+' · '+dayCount+' day'+(dayCount===1?'':'s'));
  card.innerHTML =
    '<div class="card-header" onclick="toggleCard(this.closest(\'.country-card\'))">'+
      '<span class="country-flag">'+flagImg(c.flag,28)+'</span>'+
      '<span class="country-name">'+c.name+'</span>'+
      '<span class="visit-count">'+visitCountLabel+'</span>'+
      '<span class="card-chevron">›</span>'+
    '</div>'+
    '<div class="card-body">'+
      '<div class="city-name" style="margin-bottom:8px">📍 <span>'+stripBookingCodes(c.city)+'</span></div>'+
      (visitsHtml ? '<div class="card-section-label">Visits</div><div class="visits-list">'+visitsHtml+'</div>' : '')+
      (eventsHtml ? '<div class="card-section-label">Events</div><div class="visits-list">'+eventsHtml+'</div>' : '')+
      noteHtml+
      '<button class="fly-btn" onclick="event.stopPropagation();map.flyTo(['+c.lat+','+c.lng+'],5,{duration:1.2})">🗺 Show on map</button>'+
    '</div>';

  grid.appendChild(card);
});

// Add event markers (orange/amber style)
function createEventIcon(emoji) {
  return L.divIcon({
    className: '',
    html: `<div style="
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 28px; height: 28px;
      border: 2px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;">
      <span style="transform: rotate(45deg); font-size: 12px; line-height:1;">${emoji}</span>
    </div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -30]
  });
}

events.forEach(ev => {
  const marker = L.marker([ev.lat, ev.lng], { icon: createEventIcon(ev.emoji) });
  marker.bindPopup(`
    <div class="popup-content">
      <div class="popup-flag">${ev.emoji}</div>
      <div class="popup-country" style="color:#f59e0b;">${ev.name}</div>
      <div class="popup-city">📍 ${stripBookingCodes(ev.venue)}</div>
      <div class="popup-dates"><div>${stripBookingCodes(ev.address)}</div><div>${ev.date}</div></div>
    </div>
  `, { maxWidth: 260 });
  marker.addTo(eventLayer);
  eventMarkers.push({ marker: marker, date: ev.date });
});

// Build events grid with type filter
var eventsGrid = document.getElementById('events-grid');
var filterBar   = document.getElementById('event-filter-bar');
var eventTypes  = new Set();

events.forEach(function(ev) {
  var type = ev.type || 'Other';
  eventTypes.add(type);

// Simplified timeline from stays[] with Israel home gaps
(function(){
  var tlC=document.getElementById('timeline');
  tlC.classList.add('tl-log');
  var sorted=[...stays].sort(function(a,b){return new Date(a.from)-new Date(b.from);});
  var all=[],prevEnd=null;
  sorted.forEach(function(s){
    if(prevEnd){
      var gs=new Date(prevEnd); gs.setDate(gs.getDate()+1);
      var ns=new Date(s.from);
      if((ns-gs)/86400000>=4) all.push(Object.assign({},HOME,{from:gs.toISOString().slice(0,10),to:s.from}));
    }
    all.push(s); prevEnd=s.to;
  });
  var grouped=[];
  all.forEach(function(p){
    var last=grouped[grouped.length-1];
    if(last&&last.country===p.country&&last.flag===p.flag) last.to=p.to;
    else grouped.push(Object.assign({},p));
  });

  // Group "expected" stays (from upcoming flight bookings) the same way,
  // keeping them tagged so they render with distinct styling.
  var expGrouped=[];
  [...expectedStays].sort(function(a,b){return new Date(a.from)-new Date(b.from);}).forEach(function(p){
    var last=expGrouped[expGrouped.length-1];
    if(last&&last.country===p.country&&last.flag===p.flag) last.to=p.to;
    else expGrouped.push(Object.assign({},p,{expected:true}));
  });

  // Split entries that span multiple calendar years into one segment per
  // year, so every year's section reflects only the months within it.
  function toSegments(list){
    var segs=[];
    list.forEach(function(entry){
      var fromD=new Date(entry.from+'T12:00:00'), toD=new Date(entry.to+'T12:00:00');
      var startYr=fromD.getFullYear(), endYr=toD.getFullYear();
      for(var yr=startYr; yr<=endYr; yr++){
        var segFrom=(yr===startYr)?entry.from:(yr+'-01-01');
        var segTo=(yr===endYr)?entry.to:(yr+'-12-31');
        segs.push(Object.assign({},entry,{from:segFrom,to:segTo,year:yr}));
      }
    });
    return segs;
  }
  var segments=toSegments(grouped).concat(toSegments(expGrouped));

  // Most recent first.
  segments.sort(function(a,b){return new Date(b.from)-new Date(a.from);});

  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var today=new Date(),lastYr='';
  segments.forEach(function(entry){
    var fd=new Date(entry.from+'T12:00:00'), td=new Date(entry.to+'T12:00:00');
    var yr=entry.year.toString();
    var startMo=MO[fd.getMonth()], endMo=MO[td.getMonth()];
    var moLabel=(startMo===endMo)?startMo:(startMo+' → '+endMo);
    var isFuture=new Date(entry.from)>today,isHome=entry.country===HOME.country;
    if(yr!==lastYr){
      lastYr=yr;
      var div=document.createElement('div');
      div.style.cssText='grid-column:1/-1;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:3px;color:#3d4166;text-transform:uppercase;padding:16px 0 8px;';
      div.textContent='── '+yr+' ──';
      div.dataset.divider='1';
      tlC.appendChild(div);
    }
    var tag = entry.expected
      ? ' <span style="font-size:.65rem;color:#6b7499">(expected)</span>'
      : (isFuture ? ' <span style="font-size:.65rem;color:#4a5080">(upcoming)</span>' : '');
    var el=document.createElement('div');
    el.className='tl-entry'+(isHome?' tl-home':'')+(entry.expected?' tl-expected':'');
    el.dataset.to=entry.to;
    el.dataset.future=(isFuture||entry.expected)?'1':'0';
    el.innerHTML=
      '<div class="tl-date-col"><div class="tl-month">'+moLabel+'</div></div>'+
      '<div class="tl-spine"><div class="tl-node'+((isFuture||entry.expected)?' future':'')+(entry.expected?' expected':'')+'"></div></div>'+
      '<div class="tl-body"><div class="tl-flag-name">'+
        flagImg(entry.flag,16)+' '+entry.country+ tag +
      '</div></div>';
    tlC.appendChild(el);
  });

  // Hide/show entries and year dividers per the years-back filter.
  window.applyTimelineFilter = function() {
    var cutoff = getYearsCutoff();
    var lastDivider = null, dividerHasVisible = false;
    Array.from(tlC.children).forEach(function(el){
      if (el.dataset.divider) {
        if (lastDivider) lastDivider.style.display = dividerHasVisible ? '' : 'none';
        lastDivider = el; dividerHasVisible = false;
      } else {
        var visible = el.dataset.future === '1' || isRecentEnough(el.dataset.to, cutoff);
        el.style.display = visible ? '' : 'none';
        if (visible) dividerHasVisible = true;
      }
    });
    if (lastDivider) lastDivider.style.display = dividerHasVisible ? '' : 'none';
  };
})();

function getStayForDate(dateStr) {
  const ts = new Date(dateStr).getTime();
  for (const s of stays) {
    if (ts >= new Date(s.from).getTime() && ts <= new Date(s.to).getTime()) return s;
  }

  // "Expected" stays from upcoming flight bookings - shown on the timeline
  // and calendar only (not on the map).
  for (const s of expectedStays) {
    if (ts >= new Date(s.from).getTime() && ts <= new Date(s.to).getTime()) return { ...s, expected: true };
  }

  // Beyond the last known stay: show the last known location for dates up to
  // (and including) today, and "Unknown" for any date after today.
  const lastStay = stays[stays.length - 1];
  if (lastStay && ts > new Date(lastStay.to).getTime()) {
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    if (ts <= new Date(todayStr).getTime()) {
      return { ...lastStay, from: dateStr, to: dateStr, lastKnown: true };
    }
    return { flag: '❓', country: 'Unknown', city: 'No travel data yet', from: dateStr, to: dateStr, unknown: true };
  }

  return { ...HOME, from: dateStr, to: dateStr };
}

function countryHue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return h % 360;
}
function countryStyle(name) {
  if (name === 'Israel') return { bg:'#12152a', border:'#2e3250', text:'#4a5080' };
  if (name === 'Unknown') return { bg:'#0d0f1e', border:'#1d2138', text:'#3a3f5c' };
  const h = countryHue(name);
  return { bg:`hsl(${h},38%,19%)`, border:`hsl(${h},48%,32%)`, text:`hsl(${h},80%,72%)` };
}

let calYear, calMonth, calSelected = null;

function renderCal() {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = MONTHS[calMonth] + ' ' + calYear;

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const container = document.getElementById('cal-days');
  container.innerHTML = '';
  const legendMap = {};

  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div');
    e.className = 'cal-cell empty';
    container.appendChild(e);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const stay = getStayForDate(ds);
    const st = countryStyle(stay.country);
    const legendKey = stay.country + (stay.expected ? ' (expected)' : '');
    legendMap[legendKey] = { st, flag: stay.flag, expected: !!stay.expected };

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (ds === todayStr ? ' today' : '') + (ds === calSelected ? ' selected' : '') + (stay.expected ? ' expected' : '');
    cell.style.cssText = `background:${st.bg};border-color:${st.border};color:${st.text}`;
    cell.textContent = d;
    cell.title = `${stay.flag} ${stay.country}` + (stay.expected ? ' (expected)' : '');
    cell.onclick = () => { calSelected = ds; renderCal(); showResult(ds); };
    container.appendChild(cell);
  }

  // Legend
  const legend = document.getElementById('cal-legend');
  legend.innerHTML = '';
  Object.entries(legendMap).forEach(([name, {st, flag, expected}]) => {
    const item = document.createElement('div');
    item.className = 'cal-legend-item' + (expected ? ' expected' : '');
    item.style.cssText = `background:${st.bg};border-color:${st.border}`;
    item.innerHTML = `<span>${flag}</span><span style="color:${st.text}">${name}</span>`;
    legend.appendChild(item);
  });

  if (calSelected) showResult(calSelected);
  else showResult(calYear === today.getFullYear() && calMonth === today.getMonth() ? todayStr
    : `${calYear}-${String(calMonth+1).padStart(2,'0')}-01`);
}

function showResult(ds) {
  const stay = getStayForDate(ds);
  const st = countryStyle(stay.country);
  const d = new Date(ds + 'T12:00:00');
  const label = d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const expectedTag = stay.expected ? ' <span style="font-size:.7rem;font-weight:600;color:#6b7499">(expected)</span>' : '';
  document.getElementById('cal-result').innerHTML =
    '<div class="cal-result-flag">' + stay.flag + '</div>' +
    '<div>' +
      '<div class="cal-result-country" style="color:' + st.text + '">' + stay.country + expectedTag + '</div>' +
      '<div class="cal-result-city">' + stripBookingCodes(stay.city) + '</div>' +
      '<div class="cal-result-date">' + label + '</div>' +
    '</div>';
}

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  document.getElementById('cal-prev').onclick = function() { if (--calMonth < 0) { calMonth = 11; calYear--; } renderCal(); };
  document.getElementById('cal-next').onclick = function() { if (++calMonth > 11) { calMonth = 0; calYear++; } renderCal(); };
  document.getElementById('cal-date-jump').onchange = function() {
    var d = new Date(this.value);
    if (!isNaN(d.getTime())) { calYear = d.getFullYear(); calMonth = d.getMonth(); calSelected = this.value; renderCal(); }
  };
  renderCal();
}

    .filter(function(c){ return c.style.display !== 'none'; }).length;

// Dynamic stats - recalculated whenever the years-back filter changes
function updateDynamicStats() {
  var cutoff = getYearsCutoff();

  // Continents: distinct regions among countries currently visible
  var visibleRegions = new Set();
  document.querySelectorAll('#countries-grid .country-card').forEach(function(card){
    if (card.style.display !== 'none') visibleRegions.add(card.dataset.region);
  });
  var elC = document.getElementById('stat-continents');
  if (elC) elC.textContent = visibleRegions.size;

  // Years: span of years covered by stays within the selected window
  var relevantYears = stays
    .filter(function(s){ return isRecentEnough(s.to, cutoff); })
    .map(function(s){ return parseInt(s.from); });
  var elY = document.getElementById('stat-years');
  if (elY) {
    elY.textContent = relevantYears.length
      ? (new Date().getFullYear() - Math.min.apply(null, relevantYears) + 1)
      : 0;
  }
}

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ── Marker (created once) ──
  var tlMarker  = null;
  var lastCoords  = null;
  var lastCountry = null;

  function createTlMarker(coords, flag) {
    var html =
      '<div style="position:relative;width:48px;height:48px;">' +
        '<div style="width:48px;height:48px;border-radius:50%;overflow:hidden;' +
             'border:3px solid #7c9ef0;box-shadow:0 0 0 3px rgba(124,158,240,.25),0 4px 16px rgba(0,0,0,.7);">' +
          '<img src="' + PROFILE_PIC + '" width="48" height="48" style="border-radius:50%;object-fit:cover;display:block;">' +
        '</div>' +
        '<img id="tl-flag-badge" src="' + flagSrc(flag) + '" ' +
             'style="position:absolute;bottom:-4px;right:-4px;width:22px;height:15px;' +
             'border-radius:3px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);">' +
      '</div>';
    tlMarker = L.marker(coords, {
      icon: L.divIcon({ className:'', html:html, iconSize:[48,48], iconAnchor:[24,24] }),
      zIndexOffset: 2000
    }).addTo(map);
    lastCoords  = coords;
    lastCountry = null; // force badge update on first render
  }

  // ── Trail ──
  var trailPoints = [];
  var trailLine   = null;

  function addTrailPoint(coords) {
    trailPoints.push(L.latLng(coords));
    if (trailLine) {
      trailLine.setLatLngs(trailPoints);
    } else if (trailPoints.length >= 2) {
      trailLine = L.polyline(trailPoints, {
        color:'#7c9ef0', weight:2, opacity:0.55, dashArray:'5 7'
      }).addTo(map);
    }
  }

  function clearTrail() {
    trailPoints = [];
    if (trailLine) { map.removeLayer(trailLine); trailLine = null; }
  }

  // ── Animated country-change move ──
  var moveRaf = null;

  function animateMove(fromCoords, toCoords, flag, country, onDone) {
    if (moveRaf) { cancelAnimationFrame(moveRaf); moveRaf = null; }

    // Fly map to frame both points
    var bounds = L.latLngBounds([L.latLng(fromCoords), L.latLng(toCoords)]).pad(0.25);
    map.flyToBounds(bounds, { duration:0.75, maxZoom:6, easeLinearity:0.4 });

    var dur = 900, startT = null;
    function step(now) {
      if (!startT) startT = now;
      var t = Math.min(1, (now - startT) / dur);
      var e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOut
      tlMarker.setLatLng([
        fromCoords[0] + (toCoords[0] - fromCoords[0]) * e,
        fromCoords[1] + (toCoords[1] - fromCoords[1]) * e
      ]);
      // Swap flag badge at halfway point
      if (t >= 0.5 && country !== lastCountry) {
        var badge = document.getElementById('tl-flag-badge');
        if (badge) badge.src = flagSrc(flag);
        lastCountry = country;
      }
      if (t < 1) {
        moveRaf = requestAnimationFrame(step);
      } else {
        tlMarker.setLatLng(toCoords);
        lastCoords   = toCoords;
        addTrailPoint(toCoords);
        moveRaf = null;
        onDone();
      }
    }
    requestAnimationFrame(step);
  }

  // ── Date overlay helper ──
  var dateOverlay = document.getElementById('tl-date-overlay');
  function setDateOverlay(ts) {
    var d = new Date(ts);
    dateOverlay.textContent = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    document.getElementById('tl-date').textContent = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ── Hide / restore all map markers ──
  function hideAllMapMarkers() {
    if (map.hasLayer(countryLayer)) map.removeLayer(countryLayer);
    if (map.hasLayer(eventLayer))   map.removeLayer(eventLayer);
  }
  function restoreAllMapMarkers() { applyMapFilters(); }

  // ── Playback state ──
  var playing = false, rafId = null, lastRaf = null;
  var currentTs = tlMax;
  var speedDaysPerSec = 300;

  // ── Main playback step ──
  function tlStep(now) {
    if (!playing) return;
    if (lastRaf !== null) {
      var dt = Math.min(now - lastRaf, 150);
      currentTs = Math.min(tlMax, currentTs + (dt / 1000) * speedDaysPerSec * 86400000);
    }
    lastRaf = now;

    var p = getPeriod(currentTs);
    var newCoords = coordMap[p.country] || [31.5, 34.75];

    // Update slider + date
    document.getElementById('tl-slider').value = (currentTs - tlMin) / tlRange * 10000;
    setDateOverlay(currentTs);

    // Country changed → pause timer and animate the move
    if (p.country !== lastCountry && lastCountry !== null) {
      var from = lastCoords || coordMap[lastCountry] || [31.5, 34.75];
      animateMove(from, newCoords, p.flag, p.country, function() {
        if (playing) {
          // Update sidebar label
          var city = (p.city||'').split('–')[0].split('(')[0].split(';')[0].trim().substring(0,36);
          document.getElementById('tl-loc').textContent = p.flag+' '+p.country+(city?' · '+city:'');
          lastRaf = null;
          if (currentTs < tlMax) rafId = requestAnimationFrame(tlStep);
          else tlStop();
        }
      });
      return; // wait for animation callback
    }

    // Same country — just move marker (no animation needed)
    if (!tlMarker) {
      createTlMarker(newCoords, p.flag);
      addTrailPoint(newCoords);
    } else {
      tlMarker.setLatLng(newCoords);
      lastCoords = newCoords;
      if (p.country !== lastCountry) {
        var badge = document.getElementById('tl-flag-badge');
        if (badge) badge.src = flagSrc(p.flag);
        lastCountry = p.country;
      }
    }

    var city = (p.city||'').split('–')[0].split('(')[0].split(';')[0].trim().substring(0,36);
    document.getElementById('tl-loc').textContent = p.flag+' '+p.country+(city?' · '+city:'');

    if (currentTs >= tlMax) { tlStop(); return; }
    rafId = requestAnimationFrame(tlStep);
  }

  // ── Stop ──
  function tlStop() {
    playing = false; lastRaf = null;
    if (rafId)    { cancelAnimationFrame(rafId);    rafId    = null; }
    if (moveRaf)  { cancelAnimationFrame(moveRaf);  moveRaf  = null; }
    document.getElementById('tl-play-btn').textContent = '▶';
    dateOverlay.style.display = 'none';
    clearTrail();
    if (tlMarker) { map.removeLayer(tlMarker); tlMarker = null; lastCountry = null; lastCoords = null; }
    restoreAllMapMarkers();
    document.getElementById('tl-date').textContent = '▶ press play';
    document.getElementById('tl-loc').textContent  = '2005 → today';
  }

  // ── Public API ──
  window.tlTogglePlay = function() {
    if (playing) { tlStop(); return; }
    if (currentTs >= tlMax) { currentTs = tlMin; clearTrail(); }
    playing = true;
    document.getElementById('tl-play-btn').textContent = '⏸';
    dateOverlay.style.display = 'block';
    lastRaf = null; lastCountry = null; lastCoords = null;
    hideAllMapMarkers();
    rafId = requestAnimationFrame(tlStep);
  };

  window.tlSeek = function(val) {
    currentTs = tlMin + (val / 10000) * tlRange;
    if (!playing) {
      setDateOverlay(currentTs);
    }
  };

  window.tlSetSpeed = function(val) { speedDaysPerSec = parseInt(val); };

  // Init labels
  document.getElementById('tl-date').textContent = '▶ press play';
  document.getElementById('tl-loc').textContent  = '2005 → today';

})();
</script>
