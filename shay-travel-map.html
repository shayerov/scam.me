<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shay's Travel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1d2e 0%, #252840 100%);
      border-bottom: 1px solid #2e3250;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c9ef0, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .header-left p {
      color: #8b93b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7c9ef0, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.72rem;
      color: #8b93b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    #map {
      width: 100%;
      height: 60vh;
      min-height: 400px;
      background: #0f1117;
    }

    .leaflet-tile-pane { filter: none; }

    .countries-section {
      padding: 32px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #c5cae9;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2e3250;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #2e3250;
      background: transparent;
      color: #8b93b8;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #7c9ef0;
      border-color: #7c9ef0;
      color: #fff;
    }

    .countries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .country-card {
      background: #1a1d2e;
      border: 1px solid #2e3250;
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .country-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7c9ef0, #a78bfa);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .country-card:hover, .country-card.highlighted {
      border-color: #7c9ef0;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 158, 240, 0.15);
    }

    .country-card:hover::before, .country-card.highlighted::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .country-flag {
      font-size: 2rem;
      line-height: 1;
    }

    .visit-count {
      background: rgba(124, 158, 240, 0.15);
      color: #7c9ef0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .country-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e8eaf0;
      margin-bottom: 2px;
    }

    .city-name {
      font-size: 0.82rem;
      color: #8b93b8;
      margin-bottom: 10px;
    }

    .city-name span {
      color: #7c9ef0;
    }

    .visits-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .visit-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #6b7499;
    }

    .visit-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a78bfa;
      flex-shrink: 0;
    }

    /* Custom map marker */
    .custom-marker {
      background: linear-gradient(135deg, #7c9ef0, #a78bfa);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .custom-marker-inner {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      transform: rotate(45deg);
    }

    .leaflet-popup-content-wrapper {
      background: #1a1d2e;
      border: 1px solid #2e3250;
      border-radius: 10px;
      color: #e8eaf0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .leaflet-popup-tip {
      background: #1a1d2e;
    }

    .popup-content {
      min-width: 180px;
    }

    .popup-flag { font-size: 1.8rem; margin-bottom: 4px; }
    .popup-country { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
    .popup-city { color: #7c9ef0; font-size: 0.82rem; margin-bottom: 8px; }
    .popup-dates { font-size: 0.75rem; color: #8b93b8; }
    .popup-dates div { margin-bottom: 2px; padding-left: 10px; position: relative; }
    .popup-dates div::before { content: '→'; position: absolute; left: 0; color: #a78bfa; }

    .timeline-section {
      padding: 0 32px 32px;
    }

    .tl-log {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .tl-log::before {
      content: '';
      position: absolute;
      left: 112px;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, #7c9ef0, #a78bfa, #3d4166);
    }

    .tl-entry {
      display: grid;
      grid-template-columns: 110px 2px 1fr;
      gap: 0 16px;
      align-items: flex-start;
      min-height: 48px;
    }

    .tl-date-col {
      text-align: right;
      padding: 10px 0;
    }

    .tl-date-main {
      font-size: 0.78rem;
      font-weight: 700;
      color: #c5cae9;
      line-height: 1.2;
    }

    .tl-date-year {
      font-size: 0.68rem;
      color: #4a5080;
      margin-top: 2px;
    }

    .tl-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }

    .tl-node {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7c9ef0;
      border: 2px solid #0f1117;
      flex-shrink: 0;
      z-index: 1;
    }

    .tl-node.future {
      background: #3d4166;
      border-color: #4a5080;
    }

    .tl-body {
      padding: 8px 0 8px 0;
    }

    .tl-flag-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e8eaf0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tl-city {
      font-size: 0.76rem;
      color: #6b7499;
      margin-top: 2px;
    }

    .tl-year-divider {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #3d4166;
      text-transform: uppercase;
      padding: 16px 0 8px;
      position: relative;
    }

    .events-section {
      padding: 0 32px 32px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .event-card {
      background: #141620;
      border: 1px solid #2a2d45;
      border-left: 3px solid #f59e0b;
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .event-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.12);
    }

    .event-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #e8eaf0;
      margin-bottom: 3px;
    }

    .event-venue {
      font-size: 0.78rem;
      color: #f59e0b;
      margin-bottom: 6px;
    }

    .event-date {
      font-size: 0.75rem;
      color: #6b7499;
    }

    .event-marker {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 26px;
      height: 26px;
      border: 2px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    footer {
      text-align: center;
      padding: 20px 32px;
      color: #3d4166;
      font-size: 0.75rem;
      border-top: 1px solid #1a1d2e;
    }

    /* ── Calendar Section ── */
    .calendar-section { padding: 0 32px 32px; }

    .cal-wrapper {
      background: #1a1d2e;
      border: 1px solid #2e3250;
      border-radius: 16px;
      padding: 24px;
      max-width: 680px;
    }

    .cal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .cal-nav {
      background: transparent;
      border: 1px solid #2e3250;
      color: #8b93b8;
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      padding: 4px 14px 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .cal-nav:hover { background: #7c9ef0; border-color: #7c9ef0; color: #fff; }

    .cal-month-label {
      flex: 1;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      color: #c5cae9;
      min-width: 160px;
    }

    .cal-date-jump {
      background: #12152a;
      border: 1px solid #2e3250;
      color: #8b93b8;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .cal-date-jump::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

    .cal-day-names {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 5px;
    }
    .cal-day-names span {
      text-align: center;
      font-size: 0.65rem;
      color: #4a5080;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 0;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-cell {
      min-height: 38px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      user-select: none;
      position: relative;
    }
    .cal-cell:hover:not(.empty) { transform: scale(1.12); z-index: 1; }
    .cal-cell.empty { background: transparent !important; cursor: default; border: none; }
    .cal-cell.today { box-shadow: 0 0 0 2px #7c9ef0; }
    .cal-cell.selected { box-shadow: 0 0 0 2.5px #fff; transform: scale(1.12); z-index: 1; }

    .cal-result {
      margin-top: 18px;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: #12152a;
      border-radius: 10px;
      border: 1px solid #2e3250;
    }
    .cal-result-flag { font-size: 2.4rem; line-height: 1; }
    .cal-result-country { font-size: 1rem; font-weight: 700; }
    .cal-result-city { font-size: 0.8rem; color: #6b7499; margin-top: 3px; }
    .cal-result-date { font-size: 0.72rem; color: #4a5080; margin-top: 5px; }

    .cal-legend {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cal-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      padding: 3px 9px 3px 6px;
      border-radius: 20px;
      border: 1px solid transparent;
    }
  .country-card { cursor: default; }
  .card-header { display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0; }
  .card-header:hover .country-name { color:#7c9ef0; }
  .card-chevron { margin-left:auto;font-size:1.1rem;color:#4a5080;transition:transform .2s;flex-shrink:0; }
  .country-card.expanded .card-chevron { transform:rotate(90deg); }
  .card-body { display:none;margin-top:12px;padding-top:12px;border-top:1px solid #2e3250; }
  .country-card.expanded .card-body { display:block; }
  .flag-img { border-radius:2px;vertical-align:middle; }
  .fly-btn { margin-top:10px;background:rgba(124,158,240,.12);border:1px solid rgba(124,158,240,.25);color:#7c9ef0;padding:4px 12px;border-radius:8px;font-size:.76rem;cursor:pointer; }
  .fly-btn:hover { background:rgba(124,158,240,.28); }
  .now-in-banner { font-size:30px;color:#c5cae9;font-weight:600;text-align:center;width:100%;display:block;line-height:1.3;padding:16px 0 6px;background:#0d0f1e; }
  .now-in-banner strong { color:#7c9ef0; }
  .now-in-flag { display:block;font-size:32px;line-height:1.4;padding:2px 0;background:#0d0f1e; }
  .now-in-time { display:block;font-size:15px;font-weight:400;color:#8b93b8;letter-spacing:.5px;padding-bottom:14px;background:#0d0f1e; }
  .tl-month { font-size:.76rem;font-weight:700;color:#c5cae9; }
  .tl-home .tl-node { background:#4a5080; }
  .tl-home .tl-flag-name { color:#6b7499; }

  /* ── Tabs ── */
  .tab-nav { display:flex; gap:0; background:#12152a; border-bottom:1px solid #2e3250; padding:0 24px; flex-wrap:wrap; }
  .tab-btn { background:transparent; border:none; border-bottom:3px solid transparent; color:#6b7499; padding:14px 20px; font-size:.9rem; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .tab-btn:hover { color:#c5cae9; }
  .tab-btn.active { color:#7c9ef0; border-bottom-color:#7c9ef0; }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; }

  /* ── Sort bar ── */
  .sort-bar { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .sort-label { font-size:.78rem; color:#6b7499; }
  .sort-btn { padding:5px 13px; border-radius:20px; border:1px solid #2e3250; background:transparent; color:#8b93b8; cursor:pointer; font-size:.8rem; transition:all .2s; }
  .sort-btn:hover, .sort-btn.active { background:#a78bfa; border-color:#a78bfa; color:#fff; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>✈️ Shay's Travel Map</h1>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-number" id="stat-countries">—</div><div class="stat-label">Countries</div></div>
    <div class="stat"><div class="stat-number" id="stat-years">—</div><div class="stat-label">Years</div></div>
    <div class="stat"><div class="stat-number" id="stat-continents">—</div><div class="stat-label">Continents</div></div>
  </div>
</header>
<p class="now-in-banner" id="now-in"></p>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('map',this)">🗺 Map</button>
  <button class="tab-btn" onclick="showTab('countries',this)">🌍 Countries</button>
  <button class="tab-btn" onclick="showTab('timeline',this)">📅 Timeline</button>
  <button class="tab-btn" onclick="showTab('events',this)">🎪 Events</button>
</nav>

<div class="tab-pane active" id="tab-map">
  <div id="map"></div>
</div>

<div class="tab-pane" id="tab-countries">
  <div class="countries-section">
    <div class="section-title">All Countries Visited</div>
    <div class="sort-bar">
      <span class="sort-label">Sort:</span>
      <button class="sort-btn active" onclick="sortCards('abc',this)">A–Z</button>
      <button class="sort-btn" onclick="sortCards('visits',this)">Most Visited</button>
      <button class="sort-btn" onclick="sortCards('recent',this)">Most Recent</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterCards('all', this)">All</button>
      <button class="filter-btn" onclick="filterCards('europe', this)">Europe</button>
      <button class="filter-btn" onclick="filterCards('oceania', this)">Oceania</button>
      <button class="filter-btn" onclick="filterCards('americas', this)">Americas</button>
      <button class="filter-btn" onclick="filterCards('middleeast', this)">Middle East</button>
      <button class="filter-btn" onclick="filterCards('asia', this)">Asia</button>
      <button class="filter-btn" onclick="filterCards('africa', this)">Africa</button>
      <button class="filter-btn" onclick="filterCards('antarctica', this)">Antarctica</button>
    </div>
    <div class="countries-grid" id="countries-grid"></div>
  </div>
</div>

<div class="tab-pane" id="tab-events">
  <div class="events-section">
    <div class="section-title">Events &amp; Venues</div>
    <div class="sort-bar" id="event-filter-bar">
      <span class="sort-label">Type:</span>
      <button class="sort-btn active" onclick="filterEvents('all',this)">All</button>
    </div>
    <div class="events-grid" id="events-grid"></div>
  </div>
</div>

<div class="tab-pane" id="tab-timeline">
<div class="calendar-section">
  <div class="section-title">📅 Where Was Shay?</div>
  <div class="cal-wrapper">
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev">‹</button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="cal-nav" id="cal-next">›</button>
      <input type="date" class="cal-date-jump" id="cal-date-jump" title="Jump to any date">
    </div>
    <div class="cal-day-names">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="cal-days" id="cal-days"></div>
    <div class="cal-result" id="cal-result">
      <div class="cal-result-flag">🌍</div>
      <div><div class="cal-result-country" style="color:#8b93b8">Click any day to see location</div></div>
    </div>
    <div class="cal-legend" id="cal-legend"></div>
  </div>
</div>

<div class="timeline-section">
  <div class="section-title">Trip Timeline</div>
  <div class="timeline" id="timeline"></div>
</div>
</div><!-- /tab-timeline -->

<footer>
  Data sourced from flight confirmations, train bookings &amp; accommodation emails in shay.erov@gmail.com
</footer>

<script src="shay-travel-data.js"></script>
<script>

// Initialize map
const map = L.map('map', {
  center: [30, 20],
  zoom: 2.3,
  minZoom: 2,
  zoomControl: true,
  scrollWheelZoom: true,
  worldCopyJump: false,
  maxBoundsViscosity: 1.0
});
map.setMaxBounds(L.latLngBounds(L.latLng(-85.06,-180), L.latLng(85.06,180)));

// Allow zooming out a bit further than "world fills container width"
function fitMapZoom() {
  var w = document.getElementById('map').clientWidth || window.innerWidth;
  var minZ = Math.ceil(Math.log2(w / 256));
  map.setMinZoom(Math.max(1, minZ - 2));
  if (map.getZoom() < map.getMinZoom()) map.setZoom(map.getMinZoom());
}
window.addEventListener('resize', fitMapZoom);
fitMapZoom();

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
  noWrap: true
}).addTo(map);

// Flag image helpers
function flagIso(e){return[...e].map(c=>String.fromCharCode(c.codePointAt(0)-0x1F1E6+65)).join('').toLowerCase();}
function flagSrc(e){return'https://flagcdn.com/w40/'+flagIso(e)+'.png';}
function flagImg(e,s){s=s||20;return'<img src="'+flagSrc(e)+'" width="'+s+'" height="'+Math.round(s*.67)+'" style="border-radius:2px;display:inline-block;vertical-align:middle;" onerror="this.style.display=\'none\'">';}

// Custom icon factory
function createIcon(flag) {
  return L.divIcon({
    className: '',

// Simplified timeline from stays[] with Israel home gaps
(function(){
  var tlC=document.getElementById('timeline');
  tlC.classList.add('tl-log');
  var sorted=[...stays].sort(function(a,b){return new Date(a.from)-new Date(b.from);});
  var all=[],prevEnd=null;
  sorted.forEach(function(s){
    if(prevEnd){
      var gs=new Date(prevEnd); gs.setDate(gs.getDate()+1);
      var ns=new Date(s.from);
      if((ns-gs)/86400000>=4) all.push(Object.assign({},HOME,{from:gs.toISOString().slice(0,10),to:s.from}));
    }
    all.push(s); prevEnd=s.to;
  });
  var grouped=[];
  all.forEach(function(p){
    var last=grouped[grouped.length-1];
    if(last&&last.country===p.country&&last.flag===p.flag) last.to=p.to;
    else grouped.push(Object.assign({},p));
  });
  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var today=new Date(),lastYr='';
  grouped.forEach(function(entry){
    var fd=new Date(entry.from+'T12:00:00'),yr=fd.getFullYear().toString(),mo=MO[fd.getMonth()];
    var isFuture=new Date(entry.from)>today,isHome=entry.country===HOME.country;
    if(yr!==lastYr){
      lastYr=yr;
      var div=document.createElement('div');
      div.style.cssText='grid-column:1/-1;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:3px;color:#3d4166;text-transform:uppercase;padding:16px 0 8px;';
      div.textContent='── '+yr+' ──'; tlC.appendChild(div);
    }
    var el=document.createElement('div');
    el.className='tl-entry'+(isHome?' tl-home':'');
    el.innerHTML=
      '<div class="tl-date-col"><div class="tl-month">'+mo+'</div></div>'+
      '<div class="tl-spine"><div class="tl-node'+(isFuture?' future':'')+'"></div></div>'+
      '<div class="tl-body"><div class="tl-flag-name">'+
        flagImg(entry.flag,16)+' '+entry.country+
        (isFuture?' <span style="font-size:.65rem;color:#4a5080">(upcoming)</span>':'')+
      '</div></div>';
    tlC.appendChild(el);
  });
})();

function getStayForDate(dateStr) {
  const ts = new Date(dateStr).getTime();
  for (const s of stays) {
    if (ts >= new Date(s.from).getTime() && ts <= new Date(s.to).getTime()) return s;
  }
  return { ...HOME, from: dateStr, to: dateStr };
}

function countryHue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return h % 360;
}
function countryStyle(name) {
  if (name === 'Israel') return { bg:'#12152a', border:'#2e3250', text:'#4a5080' };
  const h = countryHue(name);
  return { bg:`hsl(${h},38%,19%)`, border:`hsl(${h},48%,32%)`, text:`hsl(${h},80%,72%)` };
}

let calYear, calMonth, calSelected = null;

function renderCal() {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = MONTHS[calMonth] + ' ' + calYear;

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const container = document.getElementById('cal-days');
  container.innerHTML = '';
  const legendMap = {};

  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div');
    e.className = 'cal-cell empty';
    container.appendChild(e);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const stay = getStayForDate(ds);
    const st = countryStyle(stay.country);
    legendMap[stay.country] = { st, flag: stay.flag };

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (ds === todayStr ? ' today' : '') + (ds === calSelected ? ' selected' : '');
    cell.style.cssText = `background:${st.bg};border-color:${st.border};color:${st.text}`;
    cell.textContent = d;
    cell.title = `${stay.flag} ${stay.country}`;
    cell.onclick = () => { calSelected = ds; renderCal(); showResult(ds); };
    container.appendChild(cell);
  }

  // Legend
  const legend = document.getElementById('cal-legend');
  legend.innerHTML = '';
  Object.entries(legendMap).forEach(([name, {st, flag}]) => {
    const item = document.createElement('div');
    item.className = 'cal-legend-item';
    item.style.cssText = `background:${st.bg};border-color:${st.border}`;
    item.innerHTML = `<span>${flag}</span><span style="color:${st.text}">${name}</span>`;
    legend.appendChild(item);
  });

  if (calSelected) showResult(calSelected);
  else showResult(calYear === today.getFullYear() && calMonth === today.getMonth() ? todayStr
    : `${calYear}-${String(calMonth+1).padStart(2,'0')}-01`);
}

function showResult(ds) {
  const stay = getStayForDate(ds);
  const st = countryStyle(stay.country);
  const d = new Date(ds + 'T12:00:00');
  const label = d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  document.getElementById('cal-result').innerHTML =
    '<div class="cal-result-flag">' + stay.flag + '</div>' +
    '<div>' +
      '<div class="cal-result-country" style="color:' + st.text + '">' + stay.country + '</div>' +
      '<div class="cal-result-city">' + stay.city + '</div>' +
      '<div class="cal-result-date">' + label + '</div>' +
    '</div>';
}

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  document.getElementById('cal-prev').onclick = function() { if (--calMonth < 0) { calMonth = 11; calYear--; } renderCal(); };
  document.getElementById('cal-next').onclick = function() { if (++calMonth > 11) { calMonth = 0; calYear++; } renderCal(); };
  document.getElementById('cal-date-jump').onchange = function() {
    var d = new Date(this.value);
    if (!isNaN(d.getTime())) { calYear = d.getFullYear(); calMonth = d.getMonth(); calSelected = this.value; renderCal(); }
  };
  renderCal();
}
initCalendar();

// Show tab
function showTab(name, btn) {
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='map') { setTimeout(function(){ map.invalidateSize(); fitMapZoom(); }, 50); }
}

// Sort countries
var countryLastStay = {};
stays.forEach(function(s){ if(!countryLastStay[s.country]||s.to>countryLastStay[s.country]) countryLastStay[s.country]=s.to; });

function sortCards(mode, btn) {
  document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  var grid = document.getElementById('countries-grid');
  var cards = Array.from(grid.querySelectorAll('.country-card'));
  cards.sort(function(a,b){
    if(mode==='abc') return a.dataset.name.localeCompare(b.dataset.name);
    if(mode==='visits') return parseInt(b.dataset.visits)-parseInt(a.dataset.visits);
    if(mode==='recent') return (countryLastStay[b.dataset.name]||'').localeCompare(countryLastStay[a.dataset.name]||'');
    return 0;
  });
  cards.forEach(function(card){ grid.appendChild(card); });
}

function filterCards(region, btn) {
  document.querySelectorAll('.filter-bar .filter-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  document.querySelectorAll('#countries-grid .country-card').forEach(function(card){
    card.style.display = (region === 'all' || card.dataset.region === region) ? '' : 'none';
  });
}

(function() {
  var todayStr = new Date().toISOString().slice(0, 10);
  var nowStay = getStayForDate(todayStr);
  var nowEl = document.getElementById('now-in');
  if (!nowEl || !nowStay) return;

  var country = nowStay.country;
  var flag = nowStay.flag || '';
  var tz = COUNTRY_TZ[country] || null;

  var nameLine = 'Shay is now in <strong>' + country + (country === 'Israel' ? ' (home)' : '') + '</strong>';
  var flagLine = '<span class="now-in-flag">' + flag + '</span>';
  var timeLine = tz ? '<span class="now-in-time" id="local-clock"></span>' : '';
  nowEl.innerHTML = nameLine + flagLine + timeLine;

  if (tz) {
    function tickClock() {
      var clockEl = document.getElementById('local-clock');
      if (!clockEl) return;
      try {
        var t = new Date().toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
        clockEl.textContent = 'Local time ' + t;
      } catch(e) { clockEl.textContent = ''; }
    }
    tickClock();
    setInterval(tickClock, 30000);
  }
})();
