<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Hold on! We're almost there...</title>

  <style>
    :root {
      --fg:#eef2ff;
      --muted:#c7d2fe;
      --card:rgba(15,18,38,.82);
      --accent:#7c3aed;
      --ok:#34d399;
      --bad:#fb7185;
      --warn:#fbbf24;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--fg);
      display:grid;
      place-items:center;
      background:
        linear-gradient(rgba(15,18,38,.65), rgba(15,18,38,.65)),
        url("WaitingPoint_BG.jpg") center / cover no-repeat fixed;
    }
    .wrap{width:min(900px,92vw); padding:28px}
    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:24px;
      box-shadow:0 20px 40px rgba(0,0,0,.45);
      backdrop-filter: blur(6px);
    }
    h1{margin:0 0 10px}
    .lead{color:var(--muted); margin:0 0 16px}
    .pill{
      padding:.25rem .6rem;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      font-size:.9rem;
    }
    .banner{
      display:none;
      margin:0 0 12px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(251,191,36,.10);
      color:var(--warn);
      font-weight:800;
      text-align:center;
    }
    .timer{
      font-size:clamp(3rem,10vw,6rem);
      font-weight:900;
      text-align:center;
      font-variant-numeric:tabular-nums;
      margin-top:8px;
    }
    .sub{color:var(--muted); text-align:center; margin:10px 0 16px}
    .progress{
      height:10px;
      background:rgba(255,255,255,.12);
      border-radius:12px;
      overflow:hidden;
    }
    .bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--accent),#06b6d4);
      transition:width .2s linear;
    }
    .done{display:none; text-align:center; margin-top:14px}
    .thanks{color:var(--ok); font-weight:900}
    .footnote{margin:16px 0 0; text-align:center; color:var(--muted); font-size:.95rem; font-style:italic}
    .endOverlay{
      display:none;
      margin:0 0 14px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 12px 28px rgba(0,0,0,.35);
    }
    .endOverlay img{width:100%; display:block}

    #blocked{display:none; text-align:center}
    #blocked p{color:var(--bad)}

    .btnRow{margin-top:18px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap}
    button{
      background:rgba(255,255,255,.08);
      color:var(--fg);
      border:1px solid rgba(255,255,255,.18);
      padding:10px 18px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
    }
    button.danger{
      border-color: rgba(251,113,133,.55);
      background: rgba(251,113,133,.10);
    }
    button[disabled]{opacity:.5; cursor:not-allowed}
  </style>
</head>

<body>
<div class="wrap">
  <h1 id="pageTitle">Hold on! We're almost there...</h1>

  <p class="lead">
    Event: <span class="pill" id="eventLabel">—</span>
  </p>

  <section class="card">
    <div id="blocked">
      <h2>🚫 Not active</h2>
      <p id="blockedReason"></p>
    </div>

    <div id="active">
      <div id="waitingUI">
        <div class="banner" id="doneBanner">This event is marked DONE (dev view)</div>

        <div class="timer" id="timer">--:--</div>
        <div class="sub" id="status">Connecting…</div>
        <div class="progress" id="progress"><div class="bar" id="bar"></div></div>

        <!-- DEV controls (only shown when devPassword matches) -->
        <div class="btnRow" id="btnRow" style="display:none;">
          <button id="minus30" type="button">− 30 seconds</button>
          <button id="resetEventBtn" type="button" class="danger">Reset event (delete data)</button>
        </div>
      </div>

      <div class="done" id="done">
        <div class="endOverlay" id="endOverlay">
          <img src="WaitingPoint_End.jpg" alt="End image"/>
        </div>
        <h2 class="thanks">Thank you for waiting 🙏</h2>

        <p>You waited <b><span id="youWaited">00:00</span></b></p>

        <p>
          So far, at this event
          <b><span id="eventTotal">—</span></b>
          has been spent waiting online
        </p>

        <p class="footnote">Embarking on a quest? It's the time to light a joint... 😉</p>
      </div>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBjgXGvkvTtmLCKgCq_AuX3NHFu-P4TljU",
  authDomain: "scam-me-12e45.firebaseapp.com",
  databaseURL: "https://scam-me-12e45-default-rtdb.firebaseio.com",
  projectId: "scam-me-12e45",
  storageBucket: "scam-me-12e45.firebasestorage.app",
  messagingSenderId: "541965900648",
  appId: "1:541965900648:web:bc2c8a36da68ffc1a2d4dd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const eventLabel = $("eventLabel");
const statusEl = $("status");
const blockedEl = $("blocked");
const blockedReasonEl = $("blockedReason");
const activeEl = $("active");
const waitingUI = $("waitingUI");
const doneBanner = $("doneBanner");
const timerEl = $("timer");
const barEl = $("bar");
const btnRowEl = $("btnRow");
const minus30Btn = $("minus30");
const resetEventBtn = $("resetEventBtn");
const doneEl = $("done");
const endOverlayEl = $("endOverlay");
const eventTotalEl = $("eventTotal");
const youWaitedEl = $("youWaited");

/* ================= Helpers ================= */
function block(msg){
  blockedEl.style.display = "block";
  activeEl.style.display = "none";
  blockedReasonEl.textContent = msg;
}
function fmt(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60);
  const r = String(s % 60).padStart(2,'0');
  return `${String(m).padStart(2,'0')}:${r}`;
}
function hms(totalSec){
  const s = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return [h, m, r].map(n => String(n).padStart(2, "0")).join(":");
}
function safeNumber(x){ return (typeof x === "number" && isFinite(x)) ? x : 0; }

/* ================= URL params / dev mode ================= */
const params = new URLSearchParams(location.search);
const DEV_PASSWORD = "WaitingIsThePoint";
const devMode = params.get("devPassword") === DEV_PASSWORD;
if (devMode) btnRowEl.style.display = "flex";

/* ================= Resolve eventName (case-sensitive) ================= */
function sanitizeEventName(s){
  return (s || "")
    .trim()
    .replace(/[\/#\.\$\[\]]/g, "-")
    .slice(0, 64);
}
async function resolveEventName(){
  const fromUrl = sanitizeEventName(params.get("event_name"));
  if (fromUrl) return fromUrl;

  statusEl.textContent = "Loading default event…";
  const snap = await db.ref("defaultEvent").get();
  if (!snap.exists() || typeof snap.val() !== "string") return "";
  return sanitizeEventName(snap.val());
}

/* ================= User id (for session records only) ================= */
const USER_KEY = "scamme_user_id_v1";
function getOrCreateUserId(){
  let id = localStorage.getItem(USER_KEY);
  if (!id) {
    id = "u_" + crypto.getRandomValues(new Uint32Array(4)).join("_");
    localStorage.setItem(USER_KEY, id);
  }
  return id;
}
const userId = getOrCreateUserId();

/* ================= Tab session (refresh does NOT create new session) ================= */
const TAB_SESSION_KEY = "scamme_tab_session_v1";
function getTabSession(){
  try { return JSON.parse(sessionStorage.getItem(TAB_SESSION_KEY) || "null"); } catch { return null; }
}
function setTabSession(obj){
  sessionStorage.setItem(TAB_SESSION_KEY, JSON.stringify(obj));
}

/* ================= Timer rules ================= */
const WAIT_MS = 260_000; // 4:20, every time
// Every page load (including a refresh) is a brand-new session with a fresh 4:20.
function ensureEndAtForTab(eventName){
  const endAt = Date.now() + WAIT_MS;
  const fresh = { eventName, endAt, sessionId: null };
  setTabSession(fresh);
  return endAt;
}

/* ================= Runtime ================= */
let eventName = "";
let eventRef = null;
let totalRef = null;
let sessionRef = null;

let endAt = null;
let baselineMs = null;
let finished = false;

/* Pause/resume */
let visible = (document.visibilityState === "visible");
let hiddenAt = null;
let startedAt = null;   // when this session's countdown started
let pausedMs = 0;       // total time the tab was hidden (not counted)

function persistEndAt(){
  const st = getTabSession() || {};
  st.endAt = endAt;
  setTabSession(st);
}

document.addEventListener("visibilitychange", () => {
  const nowVisible = (document.visibilityState === "visible");
  if (finished) { visible = nowVisible; return; }

  if (!nowVisible && visible) {
    hiddenAt = Date.now();
    statusEl.textContent = "Paused…";
  } else if (nowVisible && !visible) {
    if (hiddenAt) {
      const delta = Date.now() - hiddenAt;
      pausedMs += delta;
      endAt += delta;
      baselineMs += delta;
      persistEndAt();
      hiddenAt = null;
    }
    statusEl.textContent = "Counting down…";
    tickOnce();
  }
  visible = nowVisible;
});

/* ================= Counting + DB buffer ================= */
// Waited time is derived from the same clock as the countdown, so the two always agree.
let waited = 0;    // whole seconds actually waited (tab visible)
let reported = 0;  // seconds already added to the event total

function activeSec(){
  if (!startedAt) return 0;
  const now = Date.now();
  const hiddenNow = hiddenAt ? now - hiddenAt : 0;
  const sec = Math.floor((now - startedAt - pausedMs - hiddenNow) / 1000);
  return Math.min(WAIT_MS / 1000, Math.max(0, sec));
}

/* interval handles */
let intervalFlush = null;
let intervalTick = null;

/* If event is done and devMode: show timer (banner) but DO NOT write anything */
let devDonePreview = false;

async function flush(){
  if (finished) return;
  if (devDonePreview) return;
  if (!sessionRef || !totalRef) return;

  waited = activeSec();
  const delta = waited - reported;
  if (delta <= 0) return;
  reported += delta;

  try {
    await totalRef.transaction(v => safeNumber(v) + delta);
    await sessionRef.update({ total_waiting: waited, lastSeenAt: firebase.database.ServerValue.TIMESTAMP });
  } catch {
    reported -= delta;
  }
}

function tickOnce(){
  const left = Math.max(0, endAt - Date.now());
  timerEl.textContent = fmt(left);
  const pct = 100 - (left / baselineMs) * 100;
  barEl.style.width = Math.min(100, Math.max(0, pct)).toFixed(2) + "%";
  return left;
}

async function finishNow(){
  if (finished) return;
  finished = true;

  // stop intervals
  if (intervalFlush) clearInterval(intervalFlush);
  if (intervalTick)  clearInterval(intervalTick);

  // final flush
  waited = activeSec();
  if (!devDonePreview && totalRef && sessionRef) {
    const delta = waited - reported;
    try {
      if (delta > 0) {
        reported += delta;
        await totalRef.transaction(v => safeNumber(v) + delta);
      }
      await sessionRef.update({ total_waiting: waited, didFinish: true, lastSeenAt: firebase.database.ServerValue.TIMESTAMP });
    } catch {}
  }

  statusEl.textContent = "Done!";
  youWaitedEl.textContent = waited >= 3600 ? hms(waited) : hms(waited).slice(3); // MM:SS

  try {
    const snap = totalRef ? await totalRef.get() : null;
    eventTotalEl.textContent = snap ? hms(safeNumber(snap.val())) : "—";
  } catch {
    eventTotalEl.textContent = hms(0);
  }

  $("pageTitle").style.display = "none";
  waitingUI.style.display = "none";
  endOverlayEl.style.display = "block";
  doneEl.style.display = "block";
}

/* ================= Dev controls ================= */
if (devMode) {
  minus30Btn.addEventListener("click", () => {
    if (finished) return;
    endAt = Math.max(Date.now(), endAt - 30_000);
    persistEndAt();
    tickOnce();
  });

  resetEventBtn.addEventListener("click", async () => {
    if (!eventName) return;

    // Resets require a signed-in admin (enforced by the RTDB rules).
    // Sign in first, while the click still counts as a user gesture (popup blockers).
    try {
      if (!firebase.auth().currentUser) {
        statusEl.textContent = "Signing in…";
        await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
      }
    } catch (e) {
      console.error("Sign-in failed", e);
      statusEl.textContent = "Sign-in cancelled.";
      return;
    }

    const ok = confirm(
      `RESET EVENT "${eventName}"?\n\nThis will:\n- set events/${eventName}/totalSeconds = 0\n- set events/${eventName}/done = false\n- delete all sessions where event_name == "${eventName}"\n\nThis cannot be undone.`
    );
    if (!ok) return;

    resetEventBtn.disabled = true;
    statusEl.textContent = "Resetting event…";

    try {
      await db.ref(`events/${eventName}`).update({ totalSeconds: 0, done: false });

      const sessionsSnap = await db.ref("sessions")
        .orderByChild("event_name")
        .equalTo(eventName)
        .get();

      if (sessionsSnap.exists()) {
        const updates = {};
        sessionsSnap.forEach(child => { updates[`sessions/${child.key}`] = null; });
        await db.ref().update(updates);
      }

      statusEl.textContent = "Event reset. Reloading…";
      setTimeout(() => location.reload(), 400);
    } catch (e) {
      console.error("Reset failed", e);
      resetEventBtn.disabled = false;
      statusEl.textContent = "Reset failed (rules?).";
      const who = firebase.auth().currentUser?.email || "not signed in";
      alert("Reset failed (signed in as " + who + ").\nOnly the admin account in the RTDB rules can reset.\n\n" + (e?.message || e));
    }
  });
}

/* ================= Main ================= */
(async function start(){
  statusEl.textContent = "Connecting…";

  eventName = await resolveEventName();
  if (!eventName) { block("No event specified and defaultEvent is missing/invalid."); return; }
  eventLabel.textContent = eventName;

  statusEl.textContent = "Checking event…";
  eventRef = db.ref(`events/${eventName}`);

  let eventSnap;
  try { eventSnap = await eventRef.get(); }
  catch { block("Could not read event (rules?)."); return; }

  if (!eventSnap.exists()) { block("Event does not exist."); return; }

  const ev = eventSnap.val() || {};
  const isDone = (ev.done === true);

  if (isDone && !devMode) {
    block("Event already finished.");
    return;
  }
  if (isDone && devMode) {
    devDonePreview = true;
    doneBanner.style.display = "block";
  }

  if (!devDonePreview) {
    if (typeof ev.totalSeconds !== "number") { block("Event missing totalSeconds number."); return; }
    totalRef = eventRef.child("totalSeconds");
  }

  // Timer state for this tab
  endAt = ensureEndAtForTab(eventName);
  baselineMs = Math.max(1, endAt - Date.now());
  startedAt = Date.now();

  // In dev preview (event done): show timer only (no DB writes)
  if (devDonePreview) {
    statusEl.textContent = (visible ? "Counting down… (dev preview)" : "Paused…");
    tickOnce();

    intervalTick = setInterval(() => {
      if (finished) return;
      if (!visible) return;
      if (tickOnce() <= 0) finishNow();
    }, 200);
    return;
  }

  // Always create a new session for this page load (a refresh starts over)
  statusEl.textContent = "Creating session…";
  const tabState = getTabSession() || { eventName, endAt };
  {
    sessionRef = db.ref("sessions").push();
    tabState.sessionId = sessionRef.key;
    tabState.eventName = eventName;
    tabState.endAt = endAt;
    setTabSession(tabState);

    await sessionRef.set({
      event_name: eventName,
      user_id: userId,
      total_waiting: 0,
      didFinish: false,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      lastSeenAt: firebase.database.ServerValue.TIMESTAMP
    });

    statusEl.textContent = (visible ? "Counting down…" : "Paused…");
  }

  tickOnce();

  intervalFlush = setInterval(() => {
    if (finished) return;
    if (!visible) return;
    flush();
  }, 5000);

  intervalTick = setInterval(() => {
    if (finished) return;
    if (!visible) return;
    if (tickOnce() <= 0) finishNow();
  }, 200);

  // Leaving or refreshing: send the last few unflushed seconds (best effort)
  window.addEventListener("pagehide", () => { flush(); });
})();
</script>

</body>
</html>
